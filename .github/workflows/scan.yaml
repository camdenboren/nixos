name: scan

on:
  push:
    branches-ignore: ["update*"]
    paths:
      - "flake.lock"
  pull_request:
    paths:
      - "flake.lock"
  schedule:
    # should be UTC-5 + UTC-6, but UTC-11 + UTC-12 works better
    - cron: "0 7 * 4-10 *" # Every day at 8am CDT
    - cron: "0 8 * 1-3,11-12 *" # Every day at 8am CST

jobs:
  scan:
    env:
      NIXBUILD_TOKEN: ${{ secrets.NIXBUILD_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nixbuild: builds run on nixbuild.net, but the toplevel is still copied
          # back since vulnxscan reads it from the local store (builder mode, not
          # remote store). Fork PRs have no token and build locally.
          - host-name: main
            cfg-key: nixos
            nixbuild: true
            os-label: ubuntu-latest

          - host-name: mainvm
            cfg-key: nixos
            os-label: ubuntu-latest

          - host-name: media
            cfg-key: nixos
            nixbuild: true
            os-label: ubuntu-latest

          - host-name: mac
            cfg-key: darwin
            os-label: macos-latest

          - host-name: macvm
            cfg-key: nixos
            os-label: ubuntu-24.04-arm

    name: ${{ matrix.host-name }}
    runs-on: ${{ matrix.os-label }}
    steps:
      - if: ${{ matrix.host-name == 'main' || matrix.host-name == 'media' }}
        uses: insightsengineering/disk-space-reclaimer@v1

      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            trusted-public-keys = camdenboren.cachix.org-1:gjOBUYw06+i6CJIjfmVJ+ASrVLoEoOOn/2d6XcQkiFA= edu-nation.cachix.org-1:S2s7ZDuLeFrV2qhfzXWNt+/XlnGxUjvUHv0WI+BvM+0= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://camdenboren.cachix.org https://edu-nation.cachix.org https://cache.nixos-cuda.org https://cache.nixos.org/

      # must come after install-nix-action (it writes into NIX_CONFIG); it also
      # routes the nix builds vulnxscan runs internally to nixbuild.net
      - if: ${{ matrix.nixbuild && env.NIXBUILD_TOKEN != '' }}
        uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - if: ${{ !(matrix.nixbuild && env.NIXBUILD_TOKEN != '') }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.host-name }}-${{ hashFiles('**/flake.lock') }}
          save: false

      - name: Install deps via nixpkgs-stable and run vulnxscan + script
        run: |
          REF="github:nixos/nixpkgs/$(jq -r '.nodes["nixpkgs-stable"].locked.rev' flake.lock)"
          nix shell "$REF#sbomnix" "$REF#python3" --command sh -c \
            "vulnxscan .#${{ matrix.cfg-key }}Configurations.${{ matrix.host-name }}.config.system.build.toplevel && \
            python common/usr/scr/vulnxscan.py >> summary.md"

      - name: Cat scan results to the job summary
        run: cat summary.md | tee $GITHUB_STEP_SUMMARY
