name: update

on:
  schedule:
    # should be UTC-5 + UTC-6, but UTC-11 + UTC-12 works better
    - cron: "0 7 5,19 4-10 *" # Biweekly on the 5th and 19th at 8am CDT
    - cron: "0 8 5,19 1-3,11-12 *" # Biweekly on the 5th and 19th at 8am CST
  workflow_dispatch:

jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Update flake inputs
        run: nix flake update

      - name: Commit changes
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "update: bump flake inputs"
          else
            echo "No inputs updated, skipping commit"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update
          title: Update flake inputs
          body: Automatically generated PR to update the flake inputs
          token: ${{ secrets.WORKFLOW_TOKEN }}

  pkgs:
    runs-on: ubuntu-latest
    steps:
      # container-images prefetches (downloads) whole images
      - uses: insightsengineering/disk-space-reclaimer@v1

      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          # nix-update seems to be reliant on it for some pkgs
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix profile add nixpkgs#nix-update nixpkgs#nixfmt nixpkgs#fd

      - name: Prepare git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Update derivations and commit each change
        run: |
          PKGS=(
            "actual-cli -u"
            "drawio"
            "dxvk-bin"
            "kiwix-mcp"
            "audiogridder -u"
            "britpressor -u"
            "fetish -u"
            "freq-echo -u"
            "kotelnikov -u"
            "loudmax -u"
            "maudioplugins -u"
            "neural-amp-modeler-lv2"
            "nova -u"
            "omdb-lookup --version=branch"
            "outline-export"
            "pi-acp"
            "pi-lsp --version-regex '@narumitw/pi-lsp@(.*)' --use-github-releases"
            "pi-permission-system --version-regex 'pi-permission-system-v(.*)' --use-github-releases"
            "pi-sandbox"
            "rare -u"
            "span -u"
            "ssq -u"
            "workerd -u"
            "xerj-bin -u"
          )
          FAILED=()
          for entry in "${PKGS[@]}"; do
            set -- $entry
            if ! nix-update nixosConfigurations.main.pkgs."$@" --flake; then
              FAILED+=("${entry%% *}")
              echo "::warning::Update failed for ${entry%% *}, skipping"
              git checkout -- .
              git clean -fd
              echo --------------------------------------------
              continue
            fi
            fd -t f -e nix . . -x nixfmt '{}'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "update: bump ${entry%% *}"
            else
              echo "No changes for ${entry%% *}, skipping commit"
            fi
            echo --------------------------------------------
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            {
              echo "### Failed Packages"
              echo
              for pkg in "${FAILED[@]}"; do
                echo "- $pkg"
              done
              echo
              echo "These derivations could not be updated and were skipped."
            } >> summary.md
          fi

      - name: Update container images
        run: |
          if ./common/drv/container-images/update.sh; then
            git add common/drv/container-images/sources.json
            if ! git diff --cached --quiet; then
              git commit -m "update: bump container images"
            else
              echo "No changes for container images, skipping commit"
            fi
          else
            echo "::warning::Update failed for container images, skipping"
            git checkout -- common/drv/container-images
            {
              echo "### Failed Container Images"
              echo
              echo "- container-images (see the job log)"
            } >> summary.md
          fi
          echo --------------------------------------------

      - name: Write PR body and job summary
        run: |
          {
            echo "Automatically generated PR to update the versions and hashes of one or more custom derivations via nix-update"
            if [ -f summary.md ]; then
              echo
              cat summary.md
            fi
          } > pr-body.md
          if [ -f summary.md ]; then
            cat summary.md | tee $GITHUB_STEP_SUMMARY
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: updatePkgs
          title: Update custom packages
          body-path: pr-body.md
          token: ${{ secrets.WORKFLOW_TOKEN }}
